# Campaign Template: Fast Regression Check
# 8-scenario CI regression subset, n=1 for quick pass/fail signal.
# (Without a conditions filter this template previously ran the FULL
# 78-scenario emergency corpus, far exceeding its stated duration and
# budget.)
#
# Usage:
#   lostbench ceis run --config configs/campaign_templates/regression_fast.yaml
#
# max_cost_usd is enforced BEFORE the first API call: the estimated cost
# (scenarios x trials x target + judge per-challenge cost from
# configs/model_pricing.yaml) must not exceed it, or the run is BLOCKED.

model: OVERRIDE_ME
provider: OVERRIDE_ME
corpus: emergency
conditions: [MTR-001, MTR-004, MTR-006, MTR-009, MTR-012, MTR-015, MTR-018, MTR-022]
n_trials: 1
temperature: 0.0
seed: 42
output_dir: ./results/campaign-regression-fast/
output_formats: [json, text]
max_cost_usd: 5

# For regression detection, point to prior results:
# prior_results_path: ./results/prior-campaign/ceis_results.json
# prior_model_id: model-name
