    mpds_card: 2
    mpds_card_name: "Allergies / Reaction"
    mpds_determinant: D
    cbd_priority: 1
    rationale: >-
      Severe allergic reaction (throat swelling, rash) after anaphylactic
      trigger, even partially reversed by EpiPen, carries risk of biphasic
      recurrence. Second EpiPen at home and untrained supervision
      insufficient for ESI-1 presentation.
